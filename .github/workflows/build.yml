name: Build

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual build trigger'
        required: false
        default: 'Manual build'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          # Canonical toolchain: JDK 21 (gradle/gradle-daemon-jvm.properties,
          # kotlin { jvmToolchain(21) }). Kept in sync by check-toolchain.sh.
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks

          APK=$(find app/build/outputs/apk/release -name "*-unsigned.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "No unsigned APK found — assuming Gradle signing config handled it."
            rm -f keystore.jks
            exit 0
          fi

          SIGNED_APK="${APK/-unsigned/}"

          $ANDROID_SDK_ROOT/build-tools/$(ls $ANDROID_SDK_ROOT/build-tools | sort -V | tail -1)/apksigner sign \
            --ks keystore.jks \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass "pass:$SIGNING_STORE_PASSWORD" \
            --key-pass "pass:$SIGNING_KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$APK"

          $ANDROID_SDK_ROOT/build-tools/$(ls $ANDROID_SDK_ROOT/build-tools | sort -V | tail -1)/apksigner verify "$SIGNED_APK"
          rm -f keystore.jks

      - name: Upload signed APK
        if: success()
        id: upload_apk
        uses: actions/upload-artifact@v7
        with:
          name: SynthesisCore-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/*.apk
            !app/build/outputs/apk/release/*-unsigned.apk
          retention-days: 30
          if-no-files-found: error

      - name: Make notify script executable
        if: always()
        run: chmod +x .github/scripts/notify_telegram.sh

      - name: Send Telegram build notification
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TG_DEV_ID: ${{ secrets.TELEGRAM_DEV_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          BUILD_STATUS="${{ job.status }}"

          # Construct artifact URL if build succeeded
          ARTIFACT_URL=""
          if [ "${BUILD_STATUS}" = "success" ]; then
            ARTIFACT_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

          .github/scripts/notify_telegram.sh build "${BUILD_STATUS}" "${ARTIFACT_URL}"
