[versions]
agp = "9.2.1"
hiddenapibypass = "6.1"
junit = "4.13.2"

[libraries]
hiddenapibypass = { module = "org.lsposed.hiddenapibypass:hiddenapibypass", version.ref = "hiddenapibypass" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
# The Kotlin JVM plugin is intentionally absent: it arrives with AGP, and :telemetry
# applies it version-less to inherit that single toolchain. See telemetry/build.gradle.kts.
android-application = { id = "com.android.application", version.ref = "agp" }
